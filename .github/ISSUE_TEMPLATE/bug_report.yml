name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Plain-English description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version & OS
      placeholder: e.g. v0.1.0, macOS 15.x
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Redact any secrets or personal details before pasting.
