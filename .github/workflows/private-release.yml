name: Private release

# Builds, signs, notarizes and publishes Ori Bot.app (arm64 .dmg, .zip and latest-mac.yml) to the
# private releases repo on every push to main (Protect Main & CI already run npm run check). Repos without the release
# secrets (forks included) and other branches skip it instead of failing. Setup: apps/desktop/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PRIVATE_RELEASES_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          missing=()
          for name in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID PRIVATE_RELEASES_TOKEN; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping the private release; missing secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      ORIBOT_RELEASES_REPO: ${{ vars.ORIBOT_RELEASES_REPO || 'danielzdev/ori-bot-releases' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Version this build
        run: |
          base="$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0, 2).join('.')")"
          echo "VERSION=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          npm version "$base.$GITHUB_RUN_NUMBER" --no-git-tag-version --workspace apps/desktop
      - name: Give an empty releases repo a first commit to tag
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          if ! gh api "repos/$ORIBOT_RELEASES_REPO/commits?per_page=1" > /dev/null 2>&1; then
            gh api --method PUT "repos/$ORIBOT_RELEASES_REPO/contents/README.md" \
              -f message='Start the Ori Bot release feed' \
              -f content="$(printf '# Ori Bot releases\n\nSigned builds published by the private release workflow.\n' | base64)"
          fi
      - name: Ensure a single draft release exists before uploading
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          if ! gh release view "v$VERSION" --repo "$ORIBOT_RELEASES_REPO" > /dev/null 2>&1; then
            gh api --method POST "repos/$ORIBOT_RELEASES_REPO/releases" \
              -f tag_name="v$VERSION" \
              -f name="$VERSION" \
              -F draft=true \
              -F prerelease=false \
              > /dev/null
          fi
      - name: Build, sign, notarize and upload to a draft release
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          node scripts/build-app.ts
          npx electron-builder --mac --publish always \
            -c.forceCodeSigning=true \
            -c.publish.owner="${ORIBOT_RELEASES_REPO%%/*}" \
            -c.publish.repo="${ORIBOT_RELEASES_REPO#*/}"
      - name: Publish the draft once every file is uploaded; only a newer version becomes latest
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
        run: |
          draft="$(gh release view "v$VERSION" --repo "$ORIBOT_RELEASES_REPO" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "::notice::v$VERSION is already published; leaving it as it is"
            exit 0
          fi
          latest="$(gh release view --repo "$ORIBOT_RELEASES_REPO" --json tagName --jq .tagName 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -n 1)"
          if [ -z "$latest" ] || { [ "$newest" = "$VERSION" ] && [ "${latest#v}" != "$VERSION" ]; }; then
            gh release edit "v$VERSION" --draft=false --latest --repo "$ORIBOT_RELEASES_REPO"
          else
            gh release edit "v$VERSION" --draft=false --latest=false --repo "$ORIBOT_RELEASES_REPO"
          fi
